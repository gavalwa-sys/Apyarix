
<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Our Story — Apyarix</title>

<link rel="icon" type="image/png" href="images/logo.png">

<script defer src="assets/js/site.js"></script>

<style>

/* =========================================================
   APYARIX — OUR STORY
   Clean Premium Design
   ========================================================= */

:root{
    --gold:#d89b22;
    --gold-light:#f4c95d;
    --gold-soft:#fff3d2;
    --brown:#35200f;
    --brown-light:#684522;
    --cream:#fffaf1;
    --white:#fff;
    --text:#24170d;
    --muted:#756657;
    --border:rgba(53,32,15,.10);
    --shadow:0 20px 50px rgba(53,32,15,.09);
    --radius:24px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:var(--cream);
    color:var(--text);
    line-height:1.7;
}

img{
    max-width:100%;
    display:block;
}

a{
    color:inherit;
    text-decoration:none;
}

/* =========================================================
   HEADER
   ========================================================= */

#site-header{
    position:relative;
    z-index:100;
}

#site-header img{
    max-height:55px;
    width:auto;
}


/* =========================================================
   HERO
   ========================================================= */

.page-hero{
    position:relative;
    min-height:520px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:90px 20px;

    text-align:center;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(244,201,93,.35),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #fffaf1,
            #fff0c7
        );
}

/* subtle honeycomb */

.page-hero::before{
    content:"";

    position:absolute;
    width:520px;
    height:520px;

    right:-180px;
    top:-180px;

    opacity:.12;

    background:
        linear-gradient(30deg,#b97808 12%,transparent 12.5%,transparent 87%,#b97808 87.5%),
        linear-gradient(150deg,#b97808 12%,transparent 12.5%,transparent 87%,#b97808 87.5%);

    background-size:80px 140px;

    transform:rotate(15deg);
}

.hero-content{
    position:relative;
    z-index:2;

    max-width:820px;
}

.eyebrow{
    display:inline-block;

    padding:7px 15px;

    border:1px solid rgba(185,120,8,.20);
    border-radius:999px;

    background:rgba(255,255,255,.65);

    color:#a86e0b;

    font-size:11px;
    font-weight:800;
    letter-spacing:2px;
}

.page-hero h1{
    margin:25px 0 20px;

    color:var(--brown);

    font-size:clamp(44px,7vw,76px);
    line-height:1.02;
    letter-spacing:-3px;
    font-weight:900;
}

.page-hero h1 span{
    color:var(--gold);
}

.page-hero p{
    max-width:650px;
    margin:auto;

    color:var(--muted);

    font-size:18px;
    line-height:1.8;
}


/* =========================================================
   GENERAL
   ========================================================= */

.section{
    width:min(1120px,calc(100% - 40px));
    margin:auto;

    padding:90px 0;
}

.section-label{
    margin-bottom:10px;

    color:#a86e0b;

    font-size:11px;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;
}

.section-title{
    margin-bottom:22px;

    color:var(--brown);

    font-size:clamp(34px,5vw,50px);
    line-height:1.1;
    letter-spacing:-1.5px;
}

.section-text{
    color:var(--muted);
}


/* =========================================================
   STORY
   ========================================================= */

.story{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:70px;

    align-items:center;
}

.story-copy{
    max-width:620px;
}

.story-copy p{
    margin-bottom:18px;

    color:var(--muted);

    font-size:16px;
    line-height:1.9;
}


/* Story visual */

.story-visual{
    position:relative;

    min-height:430px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.story-card{
    position:relative;

    width:min(410px,100%);
    min-height:390px;

    padding:45px;

    display:flex;
    flex-direction:column;
    justify-content:center;

    overflow:hidden;

    border-radius:32px;

    background:
        linear-gradient(
            145deg,
            #4a2c16,
            #251509
        );

    box-shadow:0 30px 70px rgba(36,21,11,.20);
}

.story-card::before{
    content:"";

    position:absolute;

    width:260px;
    height:260px;

    right:-100px;
    top:-100px;

    border-radius:50%;

    background:rgba(244,201,93,.13);
}

.story-card::after{
    content:"";

    position:absolute;

    width:180px;
    height:180px;

    left:-90px;
    bottom:-90px;

    border-radius:50%;

    background:rgba(216,155,34,.10);
}

.story-symbol{
    position:relative;
    z-index:2;

    width:70px;
    height:70px;

    margin-bottom:30px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:20px;

    background:var(--gold);

    color:var(--brown);

    font-size:34px;
}

.story-card blockquote{
    position:relative;
    z-index:2;

    color:white;

    font-size:30px;
    line-height:1.25;
    font-weight:800;
}

.story-card small{
    position:relative;
    z-index:2;

    margin-top:20px;

    color:#d9c8b0;

    font-size:11px;
    font-weight:700;
    letter-spacing:1.5px;
}


/* =========================================================
   VALUES
   ========================================================= */

.values-section{
    background:white;

    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
}

.values-intro{
    max-width:650px;
    margin-bottom:45px;
}

.values-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.value{
    padding:30px;

    border:1px solid var(--border);
    border-radius:var(--radius);

    background:linear-gradient(
        145deg,
        #fff,
        #fffaf1
    );

    transition:.3s ease;
}

.value:hover{
    transform:translateY(-6px);
    box-shadow:var(--shadow);
    border-color:rgba(216,155,34,.35);
}

.value-icon{
    width:55px;
    height:55px;

    margin-bottom:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:17px;

    background:var(--gold-soft);

    color:#a86e0b;

    font-size:23px;
}

.value h3{
    margin-bottom:10px;

    color:var(--brown);

    font-size:20px;
}

.value p{
    color:var(--muted);

    font-size:14px;
    line-height:1.8;
}


/* =========================================================
   PROMISE
   =======================
```
